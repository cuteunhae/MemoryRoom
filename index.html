<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>도시 속 빛나는 존재 — 도시 탐색</title>
    <link rel="stylesheet" href="style.css" />
    <script src="city-data.js" defer></script>
    <script src="data/school.js" defer></script>
    <script src="data/park.js" defer></script>
    <script src="data/playground.js" defer></script>
    <script src="playground.js" defer></script>
    <script src="slide.js" defer></script>
    <script src="bubbles.js" defer></script>
    <script src="park.js" defer></script>
    <script src="school.js" defer></script>
    <script src="data/items.js" defer></script>
    <script src="data/ordinary-items.js" defer></script>
    <script src="data/cabinet.js" defer></script>
    <script src="cabinet.js" defer></script>
    <script src="data/diary.js" defer></script>
    <script src="diary.js" defer></script>
    <script src="data/house.js" defer></script>
    <script src="house.js" defer></script>
    <script src="data/classroom.js" defer></script>
    <script src="classroom.js" defer></script>
    <script src="data/objects.js" defer></script>
    <script src="data/registry.js" defer></script>
    <script src="data/achievement-conditions.js" defer></script>
    <script src="data/hints.js" defer></script>
    <script src="data/settings.js" defer></script>
    <script src="input.js" defer></script>
    <script src="game-state.js" defer></script>
    <script src="achievements.js" defer></script>
    <script src="game.js" defer></script>
    <script src="inventory-list.js" defer></script>
    <script src="inventory-ui.js" defer></script>
    <script src="studio-ui.js" defer></script>
    <script src="registry.js" defer></script>
    <script src="park-ui.js" defer></script>
    <script src="hints.js" defer></script>
    <script src="data/ending.js" defer></script>
    <script src="ending.js" defer></script>
    <script src="data/save.js" defer></script>
    <script src="data/opening.js" defer></script>
    <script src="opening.js" defer></script>
    <script src="save.js" defer></script>
    <script src="map-ui.js" defer></script>
    <script src="settings-ui.js" defer></script>
  </head>
  <body>
    <dialog id="opening-dialog" aria-label="이야기의 시작" tabindex="-1"><p id="opening-text" aria-live="polite"></p></dialog>
    <main>
      <canvas id="game" width="640" height="420" tabindex="0" aria-label="방향키로 도시를 걸어 다니는 게임 화면">
        이 게임은 Canvas를 지원하는 PC 브라우저에서 실행할 수 있습니다.
      </canvas>
    </main>
    <button id="new-game" type="button"></button>
    <div id="settings-launcher"></div>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <header class="inventory-header"><h1 id="settings-title"></h1><button id="settings-close" type="button"></button></header>
      <p id="settings-message" aria-live="polite"></p>
      <div id="settings-keys"></div>
      <button id="settings-cancel-key" type="button" hidden></button>
      <button id="settings-restore" type="button"></button>
      <div class="volume-row"><label id="settings-bgm-label" for="settings-bgm"></label><input id="settings-bgm" type="range" min="0" max="100" step="1"><output id="settings-bgm-value" for="settings-bgm"></output></div>
      <div class="volume-row"><label id="settings-sfx-label" for="settings-sfx"></label><input id="settings-sfx" type="range" min="0" max="100" step="1"><output id="settings-sfx-value" for="settings-sfx"></output></div>
      <p id="settings-sound-note"></p>
      <button id="settings-new-game" type="button"></button>
    </dialog>
    <dialog id="map-dialog" aria-labelledby="map-title">
      <header class="inventory-header"><h1 id="map-title"></h1><button id="map-close" type="button"></button></header>
      <canvas id="map-picture"></canvas>
    </dialog>
    <aside id="hint-controls">
      <button id="hint-gift" type="button" hidden></button>
    </aside>
    <dialog id="hint-dialog" aria-labelledby="hint-title">
      <header class="inventory-header"><h1 id="hint-title"></h1><button id="hint-close" type="button"></button></header>
      <p id="hint-current" aria-live="polite"></p>
      <h2 id="hint-previous"></h2>
      <ul id="hint-list"></ul>
    </dialog>
    <p id="save-message" role="status" hidden></p>
    <div id="achievement-toast" class="achievement-toast" role="status" hidden></div>
    <dialog id="achievement-dialog" aria-labelledby="achievement-title">
      <header class="inventory-header">
        <h1 id="achievement-title"></h1>
        <button id="achievement-close" type="button"></button>
      </header>
      <ul id="achievement-list"></ul>
      <div id="achievement-toast-list" class="achievement-toast" role="status" hidden></div>
    </dialog>
    <dialog id="inventory-dialog" aria-labelledby="inventory-title">
      <div id="achievement-toast-inventory" class="achievement-toast" role="status" hidden></div>
      <header class="inventory-header">
        <h1 id="inventory-title">인벤토리</h1>
        <button id="inventory-close" type="button">닫기 (I)</button>
      </header>
      <p class="inventory-help">아이템을 클릭하면 선택됩니다. 사진은 확대해서 볼 수 있습니다.</p>
      <div id="inventory-list" aria-label="보유 아이템"></div>
    </dialog>
    <dialog id="inspection-dialog" aria-labelledby="inspection-title">
      <div id="achievement-toast-inspection" class="achievement-toast" role="status" hidden></div>
      <header class="inventory-header">
        <h1 id="inspection-title"></h1>
        <button id="inspection-close" type="button">닫기</button>
      </header>
      <p id="inspection-message" aria-live="polite"></p>
      <button id="studio-photo" type="button">
        <span id="photo-front">
          <img id="photo-front-image" src="assets/item-photo.png" alt="">
          <span id="photo-date"></span>
        </span>
        <span id="photo-back" hidden>
          <canvas id="photo-road-picture" width="800" height="480" aria-hidden="true"></canvas>
        </span>
      </button>
      <div id="empty-photo" hidden></div>
      <div id="classroom-panel" hidden></div>
      <section id="school-board-panel" hidden><canvas id="school-board-map" role="img"></canvas></section>
      <section id="diary-panel" hidden>
        <p id="diary-page-number" aria-live="polite"></p>
        <article id="diary-paper" class="diary-paper" aria-live="polite"><h2 id="diary-heading"></h2><p id="diary-body"></p></article>
        <button id="diary-next" type="button"></button>
      </section>
      <section id="cabinet-panel" hidden>
        <div class="cabinet-layout">
          <div id="cabinet-slots"></div>
          <div><h2 id="cabinet-inventory-title"></h2><div id="cabinet-inventory"></div><p id="cabinet-reset-notice"></p></div>
        </div>
      </section>
      <div id="slide-graffiti" hidden>
        <canvas id="slide-graffiti-picture" width="640" height="400" aria-label="집 방향과 잠긴 정문 대신 쪽문 골목을 암시하는 임시 낙서"></canvas>
      </div>
      <div id="playground-memo" hidden>
        <img id="home-memo-picture" alt="집의 잠긴 정문과 옆 골목의 쪽문 약도" />
      </div>
      <form id="carousel-panel" hidden novalidate>
        <label for="carousel-horses" id="carousel-horse-label"></label>
        <input id="carousel-horses" type="text" inputmode="numeric" autocomplete="off" maxlength="3" />
        <label for="carousel-carriages" id="carousel-carriage-label"></label>
        <input id="carousel-carriages" type="text" inputmode="numeric" autocomplete="off" maxlength="3" />
        <button id="carousel-confirm" type="submit"></button>
        <p id="carousel-result" role="status" hidden></p>
      </form>
      <div id="registry-panel" hidden>
        <p id="registry-clue"></p>
        <canvas id="registry-cover" aria-label="문질러서 지우는 명부 가림층"></canvas>
      </div>
    </dialog>
    <dialog id="ending-dialog" aria-labelledby="ending-title" tabindex="-1">
      <h1 id="ending-title"></h1>
      <canvas id="ending-art" width="900" height="500"></canvas>
      <p id="ending-caption" aria-live="polite"></p>
      <div id="ending-menu" hidden>
        <p id="ending-message"></p>
        <button id="ending-restart" type="button"></button>
        <button id="ending-exit" type="button"></button>
      </div>
    </dialog>
  </body>
</html>
